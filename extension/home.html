<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwitchPath home</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="home">
<main>
  <h1><img src="icons/48.png" alt="" width="32" height="32"> Where to?</h1>
  <form id="search" class="search" autocomplete="off">
    <input id="q" type="search" name="q" placeholder="Search the web or type a website" aria-label="Search the web or type a website">
    <button type="submit">Go</button>
  </form>
  <section>
    <h2>Your sites</h2>
    <div id="tiles" class="tiles"></div>
    <p id="empty" class="hint" hidden>Sites you visit will show up here.</p>
  </section>
  <p class="hint">This page replaces the New Tab page so you can always keep scanning. <a href="options.html">Settings</a></p>
</main>
<script src="home.js"></script>
<script src="core/tree.js"></script>
<script src="core/priors.js"></script>
<script src="core/words.js"></script>
<script src="content.js"></script>
</body>
</html>
