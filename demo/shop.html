<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Corner Shop: groceries delivered</title>
<style>
body{font:15px/1.4 Inter,system-ui,sans-serif;margin:0;background:#f6f7f4;color:#1d2a1f}
a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;gap:16px;padding:12px 24px;background:#1f6f43;color:#fff}
header .logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
header form{flex:1;display:flex;gap:6px;max-width:520px}
header input{flex:1;padding:8px 12px;border:0;border-radius:8px;font:inherit}
header button{padding:8px 14px;border:0;border-radius:8px;background:#f2c14e;font:inherit;font-weight:600}
header .acct{margin-left:auto;display:flex;gap:16px;font-weight:500}
nav{display:flex;align-items:center;gap:18px;padding:10px 24px;background:#fff;border-bottom:1px solid #e3e6df;font-weight:500}
nav select{margin-left:auto;padding:5px 8px;border-radius:6px;border:1px solid #cfd5cb;font:inherit}
.banner{margin:16px 24px 0;padding:14px 18px;border-radius:12px;background:#fdf1d3;font-weight:500}
#res{margin:8px 24px 0}
main{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:14px 24px}
.card{background:#fff;border:1px solid #e3e6df;border-radius:12px;padding:12px;display:grid;grid-template-columns:44px 1fr;column-gap:10px;align-items:center}
.card .pic{grid-row:span 2;font-size:34px;text-align:center}
.card a{font-weight:600}
.card .price{color:#55645a;font-size:14px}
.card button{grid-column:1/3;margin-top:8px;padding:6px;border:1px solid #1f6f43;border-radius:8px;background:#fff;color:#1f6f43;font:inherit;font-weight:600}
footer{display:flex;gap:16px;padding:14px 24px;color:#55645a;font-size:13px}
</style></head>
<body>
<header><a href="#" class="logo">Corner Shop</a><form onsubmit="event.preventDefault();document.getElementById('res').textContent='Results for: '+this.q.value"><input name="q" type="search" placeholder="Search groceries"> <button>Search</button></form><span class="acct"><a href="#">Sign in</a> <a href="#">Cart (0)</a></span></header>
<nav><a href="#">Fruit</a><a href="#">Vegetables</a><a href="#">Dairy</a><a href="#">Bakery</a><a href="#">Meat</a><a href="#">Frozen</a><a href="#">Drinks</a><a href="#">Snacks</a><a href="#">Household</a><a href="#">Offers</a>
<select name="store"><option>Downtown store</option><option>Riverside store</option><option>Airport store</option></select></nav>
<div class="banner">Free delivery on orders over $30 this week</div>
<p id="res"></p>
<main id="grid"></main>
<footer><a href="#">About</a><a href="#">Careers</a><a href="#">Help</a><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Accessibility</a><a href="#">Contact</a></footer>
<script>
const items=[['Bananas','🍌',1.29],['Apples','🍎',2.49],['Milk','🥛',3.19],['Bread','🍞',2.99],['Eggs','🥚',3.89],['Butter','🧈',4.29],['Cheddar','🧀',5.49],['Yogurt','🥣',1.99],['Chicken','🍗',7.99],['Rice','🍚',3.49],['Pasta','🍝',1.79],['Tomatoes','🍅',2.29],['Onions','🧅',1.49],['Coffee','☕',8.99],['Tea','🍵',4.49],['Orange juice','🧃',3.99]];
for(const [it,pic,p] of items){const d=document.createElement('div');d.className='card';d.innerHTML=`<span class="pic" aria-hidden="true">${pic}</span><a href="#">${it}</a><span class="price">$${p.toFixed(2)}</span><button onclick="document.querySelector('header a:last-child').textContent='Cart ('+(++window.n||(window.n=1))+')'">Add ${it} to cart</button>`;grid.append(d);}
</script>
</body></html>
